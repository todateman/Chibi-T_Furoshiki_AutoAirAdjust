; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs=m5stack-core2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified
    adafruit/Adafruit ADS1X15
    https://github.com/DFRobot/DFRobot_MPX5700.git

[env:m5stack-core2]
board = m5stack-core2
; OTA(Update.h)には書き込み先の2本目のappパーティション(ota_1/app1)が必須。
; ボード定義の既定値は元々default_16MB.csv(otadata+app0(ota_0)+app1(ota_1)でOTA2スロット対応)だが、
; 将来ボード定義側の既定パーティションが変わってOTAが無言で壊れることを防ぐため明示的に固定する
; (現状の実挙動は変更しない)。
board_build.partitions = default_16MB.csv

[env:m5stack-basic]
board = m5stack-grey
; 実機のM5Stack Basic(v2.7)はフラッシュ16MB搭載のため、OTA2スロット構成のdefault_16MB.csvに変更し
; OTAアップデートモードを利用可能にする(旧huge_app.csvはapp0(ota_0)のみの単一appパーティションで
; app1(ota_1)が無く、Update.hによるOTAが書き込み先パーティションを確保できず失敗していた)。
board_build.partitions = default_16MB.csv